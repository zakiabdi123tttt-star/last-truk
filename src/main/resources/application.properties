spring.application.name=truck-management

# ---- Database ----
# Local dev: default-yadan waxay isticmaalaan docker-compose.yml
# Production (Render): waxaa lagu meelaynayaa environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/truck_material_management_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Render wuxuu si otomaatig ah u dejiyaa PORT environment variable
server.port=${PORT:8080}
server.error.include-message=always

# ---- JWT ----
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyInProductionMinimum256BitsTruckManagementSystem2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# Ku dar comma-separated haddii aad leedahay in ka badan hal frontend URL
# (tusaale: http://localhost:5173,https://truckms.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
